<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feshari | فروش اقساطی جنگنده‌های دژمن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #ef394e;
    --red-dark: #d62d41;
    --ink: #23254e;
    --text: #3f4064;
    --muted: #81858b;
    --line: #e0e0e6;
    --bg: #f0f0f1;
    --card: #fff;
    --green: #00a049;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Vazirmatn", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 84px;
    line-height: 1.7;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Header */
  .header {
    background: var(--card);
    position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid var(--line);
  }
  .header-in {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px;
  }
  .logo { font-weight: 800; font-size: 26px; color: var(--red); white-space: nowrap; letter-spacing: -0.5px; }
  .search {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--bg); border-radius: 10px; padding: 0 14px;
  }
  .search input {
    flex: 1; border: 0; background: transparent; height: 42px;
    font: inherit; font-size: 14px; color: var(--ink); outline: none;
  }
  .search svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; }

  /* Promo strip */
  .promo {
    max-width: 1200px; margin: 16px auto 0; padding: 0 16px;
  }
  .promo-box {
    background: linear-gradient(135deg, #ef394e, #b8182c);
    color: #fff; border-radius: 16px; padding: 22px 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .promo-box h1 { font-size: clamp(20px, 4vw, 30px); font-weight: 800; }
  .promo-box p { font-size: 14px; opacity: .92; margin-top: 4px; }
  .timer { display: flex; gap: 6px; direction: ltr; }
  .timer b {
    background: #fff; color: var(--red); border-radius: 8px;
    min-width: 42px; text-align: center; padding: 4px 6px; font-size: 18px;
  }

  /* Grid */
  .section-title {
    max-width: 1200px; margin: 24px auto 10px; padding: 0 16px;
    font-size: 18px; font-weight: 800; color: var(--ink);
  }
  .grid {
    max-width: 1200px; margin: 0 auto; padding: 0 16px;
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }
  .card {
    background: var(--card); border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column;
    border: 1px solid var(--line);
  }
  .thumb {
    position: relative; aspect-ratio: 4 / 3;
    background: linear-gradient(160deg, #3a3f5c, #1d2038);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .badge {
    position: absolute; top: 10px; right: 10px;
    background: var(--red); color: #fff; font-weight: 700; font-size: 13px;
    padding: 2px 12px; border-radius: 20px;
  }
  .info { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .name { font-weight: 700; font-size: 15px; color: var(--ink); }
  .meta { font-size: 12px; color: var(--muted); }
  .rating { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .rating i { color: #f9a825; font-style: normal; }
  .stock { font-size: 12px; color: var(--green); font-weight: 500; }
  .price-row { margin-top: auto; padding-top: 8px; }
  .old { color: var(--muted); text-decoration: line-through; font-size: 13px; }
  .now { font-size: 18px; font-weight: 800; color: var(--ink); }
  .now small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .inst {
    margin-top: 6px; font-size: 12px; background: #fff4f5; color: var(--red-dark);
    padding: 4px 10px; border-radius: 8px; display: inline-block;
  }
  .add {
    margin-top: 10px; border: 0; border-radius: 10px; height: 42px;
    background: var(--red); color: #fff; font-weight: 700; font-size: 14px;
    transition: background .15s, transform .1s;
  }
  .add:hover { background: var(--red-dark); }
  .add:active { transform: scale(.98); }

  /* Toast */
  .toast {
    position: fixed; bottom: 96px; left: 50%; transform: translate(-50%, 20px);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; justify-content: space-around;
    background: #fff; border-top: 1px solid var(--line);
    padding: 8px 0 10px;
  }
  .bottom-nav a {
    position: relative; text-align: center; color: var(--muted);
    font-size: 12px; flex: 1;
  }
  .bottom-nav a.active { color: var(--ink); font-weight: 700; }
  .bottom-nav span { display: block; font-size: 24px; line-height: 1.3; }
  .cart-count {
    position: absolute; top: -2px; right: calc(50% - 22px);
    background: var(--red); color: #fff; font-size: 11px; font-weight: 700;
    min-width: 18px; height: 18px; border-radius: 9px; line-height: 18px;
    display: none; padding: 0 4px;
  }
  .cart-count.on { display: block; }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin: 28px 0 8px; }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 10px; }
    .info { padding: 10px; }
    .now { font-size: 15px; }
    .name { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-in">
    <a href="#" class="logo">Feshari</a>
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="جستجوی جنگنده..." aria-label="جستجو">
    </label>
  </div>
</header>

<div class="promo">
  <div class="promo-box">
    <div>
      <h1>فروش اقساطی جنگنده‌های دژمن</h1>
      <p>تا ۸۵٪ تخفیف و اقساط ۲۴ ماهه بدون پیش‌پرداخت</p>
    </div>
    <div class="timer" aria-label="زمان باقی‌مانده">
      <b id="s">00</b><b id="m">00</b><b id="h">00</b>
    </div>
  </div>
</div>

<h2 class="section-title">پیشنهادهای شگفت‌انگیز</h2>
<main class="grid" id="grid"></main>

<footer>قیمت‌ها و اطلاعات این صفحه نمونه هستند.</footer>

  const products = [
    { id: 1, name: "جنگنده F15",  maker: "بوئینگ",           old: 1567000000, off: 82, rate: 4.8, left: 5 },
    { id: 2, name: "جنگنده F16",  maker: "لاکهید مارتین",    old: 337900000,  off: 82, rate: 4.6, left: 12 },
    { id: 3, name: "جنگنده F18",  maker: "بوئینگ",           old: 154000000,  off: 85, rate: 4.5, left: 3 },
    { id: 4, name: "جنگنده F22",  maker: "لاکهید مارتین",    old: 2200000000, off: 80, rate: 4.9, left: 2 }
  ];

  const fa = n => Number(n).toLocaleString("fa-IR");
  const grid = document.getElementById("grid");
  let cart = 0;

  function render(list) {
    grid.innerHTML = list.map(p => {
      const now = Math.round(p.old * (100 - p.off) / 100);
      const inst = Math.round(now / 24);
      return `
      <article class="card">
        <div class="thumb">
          <img src="${IMG}" alt="${p.name}" loading="lazy" onerror="this.style.display='none'">
          <span class="badge">${fa(p.off)}٪</span>
        </div>
        <div class="info">
          <h3 class="name">${p.name}</h3>
          <div class="meta">سازنده: ${p.maker}</div>
          <div class="rating"><i>★</i> ${fa(p.rate)}</div>
          <div class="stock">فقط ${fa(p.left)} عدد در انبار</div>
          <div class="price-row">
            <div class="old">${fa(p.old)}</div>
            <div class="now">${fa(now)} <small>تومان</small></div>
            <div class="inst">قسط ماهانه: ${fa(inst)} تومان</div>
          </div>
          <button class="add" data-name="${p.name}">افزودن به سبد خرید</button>
        </div>
      </article>`;
    }).join("") || '<p style="padding:20px">موردی پیدا نشد.</p>';
  }
  render(products);

  // جستجو
  document.getElementById("q").addEventListener("input", e => {
    const v = e.target.value.trim().toLowerCase();
    render(products.filter(p => p.name.toLowerCase().includes(v)));
  });

  // سبد خرید
  const toast = document.getElementById("toast");
  const cc = document.getElementById("cc");
  let tt;
  grid.addEventListener("click", e => {
    const b = e.target.closest(".add");
    if (!b) return;
    cart++;
    cc.textContent = fa(cart);
    cc.classList.add("on");
    toast.textContent = b.dataset.name + " به سبد خرید اضافه شد";
    toast.classList.add("show");
    clearTimeout(tt);
    tt = setTimeout(() => toast.classList.remove("show"), 1800);
  });

  // شمارش معکوس
  let end = Date.now() + 8 * 3600 * 1000;
  function tick() {
    let d = Math.max(0, Math.floor((end - Date.now()) / 1000));
    const pad = n => fa(String(n).padStart(2, "0")).replace(/^/, "");
    document.getElementById("h").textContent = pad(Math.floor(d / 3600));
    document.getElementById("m").textContent = pad(Math.floor(d % 3600 / 60));
    document.getElementById("s").textContent = pad(d % 60);
  }
  tick(); setInterval(tick, 1000);
</script>
